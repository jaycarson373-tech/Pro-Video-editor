<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid Ponzi HQ scene</title>
<style>
  @font-face { font-family: 'Unbounded'; src: url(assets/Unbounded.woff2); font-weight: 200 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Deterministic, time-driven scene: render(t) draws the frame at t seconds. 1920x1080 (16:9).
// 120 BPM: beat 0.5 s, bar 2 s. A hard cut on every bar.
import './pyramid3d.js';

const W = 1920, H = 1080, DUR = 12.0;
const C = { ink: '#111015', surface: '#1a181f', line: '#302c37', muted: '#b6afbf', violet: '#bda1f9', violet2: '#8b5cf6', peach: '#f1b6a2', orange: '#ff783f', text: '#f6f1ff' };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eOut4 = x => 1 - Math.pow(1 - clamp(x), 4);
const eIn = x => { x = clamp(x); return x * x; };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function setFont(size, o = {}) {
  if (o.body) { ctx.font = `${o.weight || 500} ${size}px Inter`; ctx.letterSpacing = (o.ls ?? 0) + 'px'; }
  else { ctx.font = `${o.weight || 700} ${size}px Unbounded`; ctx.letterSpacing = (o.ls ?? -size * 0.045) + 'px'; }
}
function measure(s, size, o = {}) { ctx.save(); setFont(size, o); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function txt(s, x, y, o = {}) {
  const size = o.size || 80;
  ctx.save();
  setFont(size, o);
  ctx.textAlign = o.align || 'left';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.color === 'lp' || o.color === 'fire') {
    const w = ctx.measureText(s).width, x0 = o.align === 'center' ? x - w / 2 : x;
    const g = ctx.createLinearGradient(x0, y - size, x0 + w, y);
    if (o.color === 'fire') { g.addColorStop(0, '#ffd27a'); g.addColorStop(0.55, C.orange); g.addColorStop(1, '#ff4d6d'); }
    else { g.addColorStop(0, C.violet2); g.addColorStop(0.45, C.violet); g.addColorStop(1, C.peach); }
    ctx.fillStyle = g;
  } else ctx.fillStyle = o.color || C.text;
  if (o.glow) { ctx.shadowColor = o.glowColor || 'rgba(189,161,249,.45)'; ctx.shadowBlur = o.glow; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
// type that rises out of a mask, fast
function reveal(s, x, y, p, o = {}) {
  if (p <= 0) return;
  const size = o.size || 80, w = measure(s, size, o);
  ctx.save(); ctx.beginPath(); ctx.rect(x - 30, y - size * 1.05, w + 60, size * 1.4); ctx.clip();
  txt(s, x, y + (1 - eOut(p)) * size * 1.15, o);
  ctx.restore();
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

let GRAIN;
function bg(t, glowX = 1340) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const g1 = ctx.createRadialGradient(glowX, 520, 0, glowX, 520, 900);
  g1.addColorStop(0, 'rgba(139,92,246,.38)'); g1.addColorStop(1, 'rgba(17,16,21,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(140, 1080, 0, 140, 1080, 900);
  g2.addColorStop(0, 'rgba(255,120,63,.2)'); g2.addColorStop(1, 'rgba(17,16,21,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(189,161,249,.09)';
  for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) ctx.fillRect(x, y, 2, 2);
}
// the pyramid, centred at (cx, cy) with a given screen height for its body
const EXT = 1.15;
function pyramid(cx, cy, size, o = {}) {
  // floor shadow + glow
  ctx.save();
  ctx.filter = 'blur(28px)';
  ctx.fillStyle = 'rgba(139,92,246,.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + size * 0.36, size * 0.42, size * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const c = Pyramid3D.draw({ extent: EXT, ...o });
  ctx.drawImage(c, cx - size / 2, cy - size / 2, size, size);
}
const apexY = (cy, size) => cy - size / 2 * (Pyramid3D.height / 2 + 0.12) / EXT; // approx screen y of the apex
const spin = t => 0.55 + t * 0.35;

// falling liquid drops into the apex
function drops(t, cx, topY, times) {
  for (const t0 of times) {
    const k = t - t0; if (k < 0 || k > 0.32) continue;
    const p = eIn(k / 0.32);
    const y = lerp(-60, topY, p), r = 16;
    ctx.save();
    const g = ctx.createLinearGradient(cx, y - r * 2, cx, y + r);
    g.addColorStop(0, C.peach); g.addColorStop(1, C.violet2);
    ctx.fillStyle = g; ctx.shadowColor = 'rgba(189,161,249,.9)'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(cx, y - r * 1.8); ctx.bezierCurveTo(cx + r, y - r * 0.4, cx + r, y + r, cx, y + r); ctx.bezierCurveTo(cx - r, y + r, cx - r, y - r * 0.4, cx, y - r * 1.8); ctx.fill();
    ctx.restore();
  }
}
function embers(t, cx, topY, t0) {
  if (t < t0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) {
    const life = 0.9 + 0.9 * hash(i), ph = ((t - t0) / life + hash(i + 3)) % 1;
    const x = cx + (hash(i + 1) - 0.5) * 120 * (1 + ph * 2) + Math.sin(t * 3 + i) * 14, y = topY - ph * 380;
    ctx.globalAlpha = Math.sin(Math.PI * ph) * clamp((t - t0) * 4);
    ctx.fillStyle = i % 3 ? 'rgba(255,120,63,.9)' : 'rgba(255,210,122,.95)';
    ctx.beginPath(); ctx.arc(x, y, (2.5 + 4 * hash(i + 2)) * (1 - ph), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ------------------------------------------------------------------ shots
const PX = 1420, PY = 560, PS = 880;
function eyebrow(s, t0, t) { txt(s, 160, 330, { size: 22, body: true, weight: 700, ls: 5, color: C.orange, alpha: eOut4(P(t, t0, t0 + 0.25)) }); }

function s1(t) { // 0-2  Many coins.
  bg(t);
  pyramid(PX, PY, PS, { ry: spin(t), level: 0 });
  drops(t, PX, apexY(PY, PS), [1.0, 1.25, 1.5, 1.75]);
  eyebrow('LIQUID PONZI / PUMP LAUNCHPAD', 0.1, t);
  reveal('Many coins.', 160, 560, P(t, 0.05, 0.5), { size: 128 });
}
function s2(t) { // 2-4  One liquidity pool.
  bg(t);
  const lev = 0.38 * eOut4(P(t, 2.0, 3.6));
  pyramid(PX, PY, PS, { ry: spin(t), level: lev });
  drops(t, PX, apexY(PY, PS), [2.0, 2.25, 2.5]);
  eyebrow('LIQUID PONZI / PUMP LAUNCHPAD', -1, t);
  txt('Many coins.', 160, 500, { size: 88, color: C.muted, alpha: 0.6 });
  reveal('One liquidity pool.', 160, 630, P(t, 2.0, 2.45), { size: 88, color: 'lp' });
}
function s3(t) { // 4-6  80%
  bg(t);
  const lev = lerp(0.38, 0.66, eOut4(P(t, 4.0, 5.4)));
  pyramid(PX, PY, PS, { ry: spin(t), level: lev });
  eyebrow('CREATOR FEES', 4.0, t);
  const n = Math.round(80 * eOut4(P(t, 4.0, 4.45)));
  reveal(n + '%', 150, 600, P(t, 4.0, 4.3), { size: 260, color: 'lp' });
  reveal('builds each coin’s', 160, 720, P(t, 4.2, 4.6), { size: 58, weight: 600 });
  reveal('own liquidity.', 160, 800, P(t, 4.3, 4.7), { size: 58, weight: 600 });
  txt('Paired with SOL and locked once it bonds.', 162, 880, { size: 30, body: true, color: C.muted, alpha: eOut4(P(t, 4.8, 5.1)) });
}
function s4(t) { // 6-8  20%
  bg(t);
  pyramid(PX, PY, PS, { ry: spin(t), level: 0.68, edge: 1.6 + 1.2 * Math.max(0, Math.sin((t - 6) * 6)) * P(t, 6.0, 6.3) });
  embers(t, PX, apexY(PY, PS) + 20, 6.0);
  eyebrow('CREATOR FEES', -1, t);
  const n = Math.round(20 * eOut4(P(t, 6.0, 6.35)));
  reveal(n + '%', 150, 600, P(t, 6.0, 6.3), { size: 260, color: 'fire' });
  reveal('buys back &', 160, 720, P(t, 6.2, 6.6), { size: 58, weight: 600 });
  reveal('burns $LP.', 160, 800, P(t, 6.3, 6.7), { size: 58, weight: 600 });
  txt('Liquid Ponzi is the dev of every coin on the pad.', 162, 880, { size: 30, body: true, color: C.muted, alpha: eOut4(P(t, 6.8, 7.1)) });
}
function s5(t) { // 8-12  end card, still for the last 1.5 s
  bg(t, 960);
  const still = 1 - P(t, 10.0, 10.5);
  const ry = spin(Math.min(t, 10.5));
  pyramid(960, 400, 620, { ry, level: 0.68 });
  const wm = 'Liquid Ponzi.';
  const size = 124, w = measure(wm, size);
  reveal(wm, 960 - w / 2, 860, P(t, 8.0, 8.4), { size, color: 'lp' });
  const p = eOut4(P(t, 8.5, 8.9));
  if (p > 0) {
    ctx.save(); ctx.globalAlpha = p; ctx.translate(0, (1 - p) * 20);
    const bw = 330, bh = 78, gap = 20;
    const uw = measure('liquidponzi.fun', 30, { body: true, weight: 600 }) + 70;
    const cw = measure('$LP', 30, { weight: 700, ls: 0 }) + 60;
    const x0 = 960 - (bw + gap + uw + gap + cw) / 2, y0 = 918;
    ctx.shadowColor = 'rgba(255,120,63,.55)'; ctx.shadowBlur = 30;
    rrect(x0, y0, bw, bh, 12, C.orange); ctx.shadowBlur = 0;
    txt('Launch a coin  ↗', x0 + bw / 2, y0 + 50, { size: 30, body: true, weight: 700, align: 'center', color: C.ink });
    rrect(x0 + bw + gap, y0, uw, bh, 12, 'rgba(26,24,31,.9)', C.line, 2);
    txt('liquidponzi.fun', x0 + bw + gap + uw / 2, y0 + 50, { size: 30, body: true, weight: 600, align: 'center' });
    rrect(x0 + bw + gap + uw + gap, y0, cw, bh, 39, 'rgba(255,120,63,.12)', C.orange, 2);
    txt('$LP', x0 + bw + gap + uw + gap + cw / 2, y0 + 51, { size: 30, weight: 700, ls: 0, align: 'center', color: C.orange });
    ctx.restore();
  }
}

const SHOTS = [[0, s1], [2, s2], [4, s3], [6, s4], [8, s5]];
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  let idx = 0;
  for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0] - 1e-6) idx = i;
  const t0 = SHOTS[idx][0], t1 = idx + 1 < SHOTS.length ? SHOTS[idx + 1][0] : 10.5;
  // snappy push on every cut, then a slow creep; the end card settles and stops
  const z = 1 + 0.045 * (1 - eOut((t - t0) / 0.22)) + 0.02 * clamp((t - t0) / (t1 - t0));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SHOTS[idx][1](t);
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.03; ctx.globalCompositeOperation = 'overlay';
  const fr = Math.floor(Math.min(t, 10.5) * 24), ox = Math.floor(hash(fr) * 384), oy = Math.floor(hash(fr + 0.5) * 384);
  for (let x = -ox; x < W; x += 384) for (let y = -oy; y < H; y += 384) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}

window.ready = (async () => {
  await Promise.all(['700 100px Unbounded', '600 100px Unbounded', '500 40px Inter', '600 40px Inter', '700 40px Inter'].map(f => document.fonts.load(f)));
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 384;
  const g = GRAIN.getContext('2d'); const id = g.createImageData(384, 384);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(hash(i * 0.37) * 255); id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  return true;
})();
window.render = render;
window.DUR = DUR;
</script>
</body>
