<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Perps Pad chill scene</title>
<style>
  @font-face { font-family: 'DM Sans'; src: url(../assets/fonts/dm-sans-bold.ttf); font-weight: 700; }
  @font-face { font-family: 'DM Sans'; src: url(../assets/fonts/dm-sans-regular.ttf); font-weight: 400; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic, time-driven scene: render(t) draws the frame at t seconds.
// Beat grid: 96 BPM -> beat 0.625 s, bar 2.5 s (matches chill/music.py).
const W = 1920, H = 1080, B = 0.625, DUR = 31.0;
// Perps Pad brand tokens (from pad.css)
const C = {
  bg: '#061b1e', panel: '#0b2529', raised: '#0f2d31', line: '#203c3e', ink: '#eef8f4',
  muted: '#9ab4b4', mint: '#98f4ce', light: '#c4fbe4', teal: '#19d6bd', short: '#f1b3b7',
  red: '#f1b3b7', accent: '#98f4ce', dark: '#03100f'
};
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ------------------------------------------------------------------ utils
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function env(t, times, decay) {
  let v = 0;
  for (const ti of times) if (t >= ti - 1e-6) v = Math.max(v, Math.exp(-(t - ti) * decay));
  return v;
}
function lastHit(t, times) { let r = null; for (const ti of times) if (t >= ti - 1e-6) r = ti; return r; }
const range = (a, b, step) => { const r = []; for (let x = a; x < b - 1e-6; x += step) r.push(+x.toFixed(3)); return r; };


function font(size, o = {}) {
  return o.mono ? `${o.weight || 700} ${size}px "JetBrains Mono"` : `${o.weight || 700} ${size}px "DM Sans"`;
}
function setFont(size, o = {}) {
  ctx.font = font(size, o);
  ctx.letterSpacing = (o.ls != null ? o.ls : (o.mono ? size * 0.14 : -size * 0.045)) + 'px';
}
function measure(s, size, o = {}) {
  ctx.save(); setFont(size, o); const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function fit(s, maxW, maxSize, o = {}) { return Math.min(maxSize, maxW / measure(s, 100, o) * 100); }

function txt(s, x, y, o = {}) {
  const size = o.size || 100;
  ctx.save();
  setFont(size, o);
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.chroma && o.chroma > 0.3) {
    const d = o.chroma;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,70,130,.6)'; ctx.fillText(s, x - d, y);
    ctx.fillStyle = 'rgba(40,210,255,.6)'; ctx.fillText(s, x + d, y);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (o.glow) { ctx.shadowColor = o.glowColor || 'rgba(111,230,211,.8)'; ctx.shadowBlur = o.glow; }
  ctx.fillStyle = o.color || C.ink;
  if (o.stroke) { ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.stroke; ctx.strokeText(s, x, y); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}

// text that slides up out of a mask
function reveal(s, x, y, p, o = {}) {
  if (p <= 0) return;
  const size = o.size || 100;
  const w = measure(s, size, o);
  const al = o.align || 'left';
  const x0 = al === 'left' ? x : al === 'center' ? x - w / 2 : x - w;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0 - 40, y - size * 1.05, w + 80, size * 1.4);
  ctx.clip();
  txt(s, x, y + (1 - eOutExpo(p)) * size * 1.2, o);
  ctx.restore();
}

// word that punches in on a hit
function punch(s, x, y, k, o = {}) {
  const sc = (o.base || 1) * (1 + (o.from ?? 0.3) * Math.exp(-k * 16)) * (1 + (o.drift ?? 0.04) * k);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  txt(s, 0, 0, { ...o, align: o.align || 'center', base: 'middle', chroma: (o.chroma ?? 22) * Math.exp(-k * 9) });
  ctx.restore();
}

function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// ------------------------------------------------------------------ layers
function bg(tint = 'rgba(18,110,104,0.55)', cx = W * 0.62, cy = H * 0.45, base = C.bg) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.75);
  g.addColorStop(0, tint); g.addColorStop(1, 'rgba(4,24,28,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function ribbons(t, alpha, o = {}) {
  if (alpha <= 0) return;
  const lg = ctx.createLinearGradient(0, 0, W, 0);
  const col = o.rgb || '87,249,219';
  lg.addColorStop(0, `rgba(${col},0)`); lg.addColorStop(.5, `rgba(${col},.65)`); lg.addColorStop(1, `rgba(${col},0)`);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = lg;
  ctx.lineWidth = o.lw || 1.6;
  const sp = o.speed || 1, yb = o.y ?? H * 0.66, amp = o.amp || 1;
  for (let r = 0; r < 8; r++) {
    ctx.beginPath();
    for (let x = -60; x <= W + 60; x += 16) {
      const y = yb + r * 15 + amp * (Math.sin(x * 0.0031 + t * 0.9 * sp + r * 0.1) * 150 + Math.sin(x * 0.0012 - t * 0.45 * sp) * 95);
      x === -60 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function dust(t, alpha, speed = 1, color = '111,230,211') {
  if (alpha <= 0) return;
  ctx.save();
  for (let i = 0; i < 110; i++) {
    const x = ((hash(i) * W + t * 18 * (0.3 + hash(i + 9)) * speed) % W + W) % W;
    const y = ((hash(i + 3) * H - t * (25 + 55 * hash(i + 5)) * speed) % H + H) % H;
    const r = 0.8 + hash(i + 7) * 2.2;
    ctx.globalAlpha = alpha * (0.25 + 0.75 * hash(i + 11)) * (0.6 + 0.4 * Math.sin(t * 3 + i));
    ctx.fillStyle = `rgb(${color})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function warp(t, k, cx = W / 2, cy = H / 2, color = C.light) {
  if (k <= 0.01) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < 150; i++) {
    const a = hash(i) * Math.PI * 2;
    const sp = 0.5 + hash(i + 1) * 1.3;
    const d = (hash(i + 2) + t * sp * 1.3) % 1;
    const r0 = 60 + d * d * 1500;
    const len = (20 + d * 300) * k;
    ctx.globalAlpha = clamp(d * 1.6) * 0.55 * k;
    ctx.lineWidth = 1 + d * 3;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
    ctx.stroke();
  }
  ctx.restore();
}

function rings(t, times, cx, cy, o = {}) {
  for (const t0 of times) {
    const k = t - t0;
    const life = o.life || 1.2;
    if (k < 0 || k > life) continue;
    const p = eOutCubic(k / life);
    ctx.save();
    ctx.globalAlpha = (1 - p) * (o.alpha ?? 0.9);
    ctx.strokeStyle = o.color || C.mint;
    ctx.lineWidth = (o.lw || 12) * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, (o.r0 || 120) + p * (o.r1 || 1100), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function burst(t, t0, cx, cy, o = {}) {
  const k = t - t0;
  if (k < 0 || k > 1.6) return;
  ctx.save();
  for (let i = 0; i < (o.n || 70); i++) {
    const a = hash(i + t0 * 13) * Math.PI * 2;
    const sp = 400 + hash(i + 5 + t0) * 1300;
    const d = sp * (1 - Math.exp(-k * 3.2)) / 3.2 * 3;
    const r = (2 + hash(i + 2) * 5) * (1 - k / 1.6);
    ctx.globalAlpha = (1 - k / 1.6) * 0.9;
    ctx.fillStyle = hash(i + 4) > 0.75 ? C.ink : C.mint;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// price-ish line, purely illustrative
function chart(x0, y0, w, h, prog, color, seed, dir, o = {}) {
  if (prog <= 0) return;
  const n = 140, pts = [];
  for (let i = 0; i <= n * prog; i++) {
    const u = i / n;
    let v = dir * (Math.pow(u, 1.7) * 1.6 - 0.8);
    v += 0.09 * Math.sin(u * 21 + seed) + 0.05 * Math.sin(u * 63 + seed * 2) + 0.03 * (hash(i + seed) - .5);
    pts.push([x0 + u * w, y0 + h / 2 - v * h / 2]);
  }
  ctx.save();
  // area
  const g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, o.fill || 'rgba(111,230,211,.28)'); g.addColorStop(1, 'rgba(111,230,211,0)');
  ctx.beginPath(); ctx.moveTo(pts[0][0], y0 + h);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(pts[pts.length - 1][0], y0 + h); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  // line
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = color; ctx.lineWidth = o.lw || 6; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = o.blur ?? 24;
  ctx.stroke();
  const hd = pts[pts.length - 1];
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(hd[0], hd[1], (o.lw || 6) * 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.arc(hd[0], hd[1], (o.lw || 6) * 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function arrow(cx, cy, size, dir, color, alpha = 1) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(dir > 0 ? -Math.PI / 4 : Math.PI / 4);
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = color; ctx.lineWidth = size * 0.13; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.moveTo(-size / 2, 0); ctx.lineTo(size / 2, 0);
  ctx.moveTo(size / 2 - size * 0.32, -size * 0.32); ctx.lineTo(size / 2, 0); ctx.lineTo(size / 2 - size * 0.32, size * 0.32);
  ctx.stroke();
  ctx.restore();
}

function eyebrow(s, x, y, alpha = 1, color = C.mint, line = true) {
  if (line) { ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.fillRect(x, y - 8, 40, 3); ctx.restore(); }
  txt(s, x + (line ? 58 : 0), y, { size: 22, mono: true, color, alpha });
}

function typed(s, p) { return s.slice(0, Math.floor(s.length * clamp(p) + 1e-6)); }


// ------------------------------------------------------------------ assets
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
let ICON, SITE, LAUNCH, GRAIN;
window.ready = (async () => {
  [ICON, SITE, LAUNCH] = await Promise.all([
    loadImg('../assets/brand/perps-pad.jpg'),
    loadImg('../assets/site-hero.png'),
    loadImg('../assets/site-launch.png'),
  ]);
  await Promise.all([
    document.fonts.load('700 100px "DM Sans"'),
    document.fonts.load('400 40px "DM Sans"'),
    document.fonts.load('700 40px "JetBrains Mono"'),
    document.fonts.load('400 40px "JetBrains Mono"'),
  ]);
  GRAIN = document.createElement('canvas');
  GRAIN.width = GRAIN.height = 384;
  const g = GRAIN.getContext('2d');
  const id = g.createImageData(384, 384);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.floor(hash(i * 0.37) * 255);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  return true;
})();

// app-icon tile with the glowing P
function icon(cx, cy, size, o = {}) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.rot || 0);
  ctx.scale(o.sx ?? 1, 1);
  ctx.globalAlpha *= (o.alpha ?? 1);
  const r = size * 0.22;
  if (o.glow) {
    ctx.shadowColor = 'rgba(25,214,189,.8)'; ctx.shadowBlur = o.glow;
    rrect(-size / 2, -size / 2, size, size, r, '#0b3b3d');
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  }
  ctx.beginPath(); ctx.roundRect(-size / 2, -size / 2, size, size, r); ctx.clip();
  ctx.drawImage(ICON, -size / 2, -size / 2, size, size);
  // glass sheen
  const g = ctx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(0.45, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-size / 2, -size / 2, size, size);
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(o.rot || 0); ctx.scale(o.sx ?? 1, 1);
  ctx.globalAlpha *= (o.alpha ?? 1) * 0.7;
  rrect(-size / 2, -size / 2, size, size, r, null, 'rgba(152,244,206,.55)', Math.max(1.5, size * 0.008));
  ctx.restore();
}

// "perps" + mint "pad" wordmark, left-aligned at x
function wordmark(x, y, size, o = {}) {
  const w1 = measure('perps', size, { ls: -size * 0.04 });
  txt('perps', x, y, { size, ls: -size * 0.04, chroma: o.chroma, glow: o.glow, glowColor: 'rgba(152,244,206,.35)' });
  txt('pad', x + w1, y, { size, ls: -size * 0.04, color: C.mint, chroma: o.chroma, glow: o.glow });
  return w1 + measure('pad', size, { ls: -size * 0.04 });
}

function tickerChip(cx, cy, size, alpha = 1, k = 9) {
  const w = measure('$PERPS', size, { mono: true }) + size * 1.4;
  const h = size * 2.1;
  const s = 1 + 0.35 * Math.exp(-k * 14);
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(152,244,206,.7)'; ctx.shadowBlur = 30;
  rrect(-w / 2, -h / 2, w, h, h / 2, 'rgba(152,244,206,.12)', C.mint, Math.max(2, size * 0.09));
  ctx.shadowBlur = 0;
  txt('$PERPS', 0, size * 0.36, { size, mono: true, color: C.mint, align: 'center' });
  ctx.restore();
}

function assetTile(cx, cy, size, label, rot, k, color = C.mint) {
  const s = 1 + 0.4 * Math.exp(-k * 14);
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  rrect(-size / 2, -size / 2, size, size, size * 0.16, '#0f3134');
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
  g.addColorStop(0, 'rgba(152,244,206,.18)'); g.addColorStop(1, 'rgba(152,244,206,0)');
  rrect(-size / 2, -size / 2, size, size, size * 0.16, g, color, 3);
  txt(label, 0, size * 0.1, { size: size * 0.26, align: 'center', color: C.ink });
  ctx.restore();
}

// strategy leg card (site's engine diagram)
function legCard(x, y, w, h, o) {
  const col = o.dir === 'LONG' ? C.mint : C.short;
  ctx.save();
  ctx.globalAlpha *= o.alpha;
  ctx.translate(x + w / 2, y + h / 2);
  const s = 1 + 0.15 * (o.pop || 0);
  ctx.scale(s, s);
  ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rrect(0, 0, w, h, 18, C.panel);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  rrect(0, 0, w, h, 18, null, o.pop > 0.05 ? col : C.line, 2 + 3 * (o.pop || 0));
  ctx.beginPath(); ctx.arc(46, 50, 22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(152,244,206,.1)'; ctx.fill(); ctx.strokeStyle = C.mint; ctx.lineWidth = 2; ctx.stroke();
  txt(o.asset[0], 46, 59, { size: 24, align: 'center', color: C.mint, ls: 0 });
  txt(o.asset, 84, 60, { size: 30, ls: 0 });
  txt(o.dir, w - 28, 58, { size: 18, mono: true, color: col, align: 'right' });
  txt(o.lev, 28, 112, { size: 20, weight: 400, color: C.muted, ls: 0 });
  txt(o.alloc, w - 28, 112, { size: 20, weight: 400, color: C.muted, align: 'right', ls: 0 });
  chart(28, 128, w - 56, h - 150, o.chartP, col, o.dir === 'LONG' ? 2 : 5, o.dir === 'LONG' ? 1 : -1, { lw: 3.5, blur: 12, fill: o.dir === 'LONG' ? 'rgba(152,244,206,.18)' : 'rgba(241,179,183,.15)' });
  ctx.restore();
}

// particles flowing along a polyline
function flow(t, pts, n, speed, color, alpha, size = 5) {
  if (alpha <= 0) return;
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
  ctx.save();
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 14;
  for (let j = 0; j < n; j++) {
    let d = ((j / n + t * speed) % 1) * total;
    let i = 0; while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const u = d / segs[i];
    const x = lerp(pts[i][0], pts[i + 1][0], u), y = lerp(pts[i][1], pts[i + 1][1], u);
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function path(pts, p, color, lw = 3, alpha = 1) {
  if (p <= 0) return;
  let total = 0; const segs = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); total += d; }
  let left = total * clamp(p);
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < segs.length && left > 0; i++) {
    const u = Math.min(1, left / segs[i]);
    ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], u), lerp(pts[i][1], pts[i + 1][1], u));
    left -= segs[i];
  }
  ctx.stroke();
  ctx.restore();
}

function browser(x, y, w, img, t, url, crop) {
  const ih = w * crop[3] / crop[2], bh = 58;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = 'rgba(25,214,189,.45)'; ctx.shadowBlur = 80;
  rrect(-w / 2, -(ih + bh) / 2, w, ih + bh, 18, C.raised);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(-w / 2, -(ih + bh) / 2, w, ih + bh, 18); ctx.clip();
  ctx.drawImage(img, crop[0], crop[1], crop[2], crop[3], -w / 2, -(ih + bh) / 2 + bh, w, ih);
  ctx.restore();
  rrect(-w / 2, -(ih + bh) / 2, w, ih + bh, 18, null, 'rgba(152,244,206,.55)', 2);
  const ty = -(ih + bh) / 2 + bh / 2;
  ['#f1b3b7', '#f1c97a', '#98f4ce'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-w / 2 + 30 + i * 24, ty, 7, 0, Math.PI * 2); ctx.fill(); });
  rrect(-300, ty - 18, 600, 36, 18, '#061a1f', C.line, 1.5);
  ctx.strokeStyle = C.mint; ctx.lineWidth = 2.2;
  ctx.strokeRect(-276, ty - 4, 14, 11);
  ctx.beginPath(); ctx.arc(-269, ty - 4, 5, Math.PI, 0); ctx.stroke();
  txt(url, -246, ty + 7, { size: 19, mono: true, weight: 400, color: C.ink, ls: 0.5 });
  if (Math.floor(t * 4) % 2 === 0) {
    const uw = measure(url, 19, { mono: true, weight: 400, ls: 0.5 });
    ctx.fillStyle = C.mint; ctx.fillRect(-244 + uw, ty - 10, 2, 20);
  }
  ctx.restore();
  return { top: -(ih + bh) / 2 + bh, scale: w / crop[2], crop };
}

  ctx.save();
  ctx.globalAlpha *= e;
  ctx.translate(W / 2, cy); ctx.scale(lerp(0.94, 1, e), lerp(0.94, 1, e)); ctx.translate(-W / 2, -cy);
  icon(W / 2 - total / 2 + is / 2, cy, is, { glow: 44 });
  wordmark(W / 2 - total / 2 + is + gap, cy + 50, ws, { glow: 16 });
  txt('ON ELYSIUM', W / 2 - total / 2 + is + gap + 8, cy + 142, { size: 22, mono: true, color: C.mint });
  ctx.restore();
  reveal('Coins with a strategy.', W / 2, 660, P(t, 25.8, 26.6), { size: 58, weight: 400, align: 'center', color: C.light, ls: -1 });
  const cp = soft(P(t, 26.5, 27.5));
  if (cp > 0) {
    ctx.save();
    ctx.globalAlpha = cp;
    ctx.translate(0, (1 - cp) * 30);
    const bw = 340, bh = 78, gap2 = 22;
    const uw = measure('perpspad.live', 30, { mono: true, ls: 1, weight: 400 }) + 70;
    const cw = measure('$PERPS', 28, { mono: true }) + 60;
    const x0 = W / 2 - (bw + gap2 + uw + gap2 + cw) / 2;
    ctx.shadowColor = 'rgba(152,244,206,.55)'; ctx.shadowBlur = 26 + 10 * Math.sin(t * 2);
    rrect(x0, 730, bw, bh, 14, C.mint);
    ctx.shadowBlur = 0;
    txt('Build your coin  →', x0 + bw / 2, 780, { size: 28, color: C.dark, align: 'center', ls: 0 });
    rrect(x0 + bw + gap2, 730, uw, bh, 14, 'rgba(6,26,31,.8)', C.line, 2);
    txt('perpspad.live', x0 + bw + gap2 + uw / 2, 780, { size: 30, mono: true, color: C.ink, align: 'center', ls: 1, weight: 400 });
    rrect(x0 + bw + gap2 + uw + gap2, 730, cw, bh, 39, 'rgba(152,244,206,.1)', C.mint, 2);
    txt('$PERPS', x0 + bw + gap2 + uw + gap2 + cw / 2, 779, { size: 28, mono: true, color: C.mint, align: 'center' });
    ctx.restore();
  }
  fadeUp('@Perpspad_live', W / 2, 880, P(t, 27.2, 27.9), { size: 26, mono: true, weight: 400, color: C.muted, align: 'center' });
  ctx.restore();
  txt('Strategy builder live. Execution coming next. Perpetual positions can lose money or be liquidated.', W / 2, H - 50,
    { size: 18, weight: 400, color: C.muted, align: 'center', ls: 0, alpha: 0.8 * P(t, 27.6, 28.3) });
}

// soft cross-dissolve between scenes
const SCENES = [[0, cIntro], [5.0, cLogo], [7.5, cLongShort], [10.0, cMix], [12.5, cEngine], [17.5, cBurn], [22.5, cBuilder], [25.0, cOutro]];

function render(t) {
  REAL_T = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  let idx = 0;
  for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i][0]) idx = i;
  ctx.save();
  const zk = 1 + 0.004 * kpulse();
  ctx.translate(W / 2, H / 2); ctx.scale(zk, zk); ctx.translate(-W / 2, -H / 2);
  SCENES[idx][1](t);
  ctx.restore();
  // dissolve in from black-teal at each cut
  const k = t - SCENES[idx][0];
  if (idx > 0 && k < 0.35) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(6,27,30,${1 - soft(k / 0.35)})`; ctx.fillRect(0, 0, W, H); }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = 'none';
  const fl = env(t, [5.0, 17.5, 25.0], 5) * 0.12;
  if (fl > 0.005) { ctx.fillStyle = `rgba(200,255,236,${fl})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.globalCompositeOperation = 'overlay';
  const fr = Math.floor(t * 24);
  const ox = Math.floor(hash(fr) * 384), oy = Math.floor(hash(fr + 0.5) * 384);
  for (let x = -ox; x < W; x += 384) for (let y = -oy; y < H; y += 384) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
  const fade = Math.max(1 - P(t, 0, 0.8), P(t, 29.4, 31.0));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.DUR = DUR;
</script>
