  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
  body { display: grid; place-items: center; font-family: 'Unbounded', system-ui, sans-serif; }
  #stage { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 7%;
        background: linear-gradient(transparent 55%, rgba(7,6,11,.65)); transition: opacity .2s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: 700 clamp(11px, 1.6vh, 16px)/1 'Unbounded', system-ui, sans-serif; letter-spacing: .04em; color: #f4ecff; cursor: pointer;
           padding: 1.1em 1.6em; border-radius: 999px; border: 1px solid rgba(183,140,255,.55); background: rgba(138,85,255,.18); backdrop-filter: blur(6px); }
  button.primary { background: linear-gradient(90deg, #8a55ff, #ff783f); border-color: transparent; }
  button:hover { filter: brightness(1.15); }
  button[disabled] { opacity: .5; cursor: default; }
  #status { color: #b78cff; font: 600 clamp(10px, 1.3vh, 13px)/1.4 system-ui, sans-serif; min-height: 1.4em; text-align: center; }
  #clock { position: absolute; top: 2%; right: 3%; color: rgba(244,236,255,.75); font: 600 clamp(10px, 1.4vh, 14px)/1 ui-monospace, monospace;
           background: rgba(7,6,11,.6); padding: .4em .6em; border-radius: 6px; }

<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <div id="clock">00:00</div>
    <div class="row">
      <button id="play" class="primary" type="button">▶ Play</button>
      <button id="replay" type="button">↻ Replay</button>
      <button id="download" type="button">⬇ Download video</button>
    </div>
    <div id="status"></div>
  </div>
</div>
<script>
/*
  Liquid Ponzi ($LP) — 15 s vertical hype video, 1080x1920, drawn on a canvas from a master clock (render(t), t = 0..15).
  Sound is generated with the Web Audio API (no files). "Download video" records canvas + audio with MediaRecorder to a .webm.
*/
const W = 1080, H = 1920, DUR = 15;
const C = { bg: '#07060b', v1: '#8a55ff', v2: '#b78cff', o1: '#ff783f', o2: '#ff9a5c', text: '#f4ecff', red: '#ff4a3d' };
const FONT = "'Unbounded', system-ui, sans-serif";
const SAFE_X = 80, MAXW = W - SAFE_X * 2;          // text safe area: 80px sides, 200px top/bottom
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const easeOutExpo = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const easeOutBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOut3 = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn2 = x => { x = clamp(x); return x * x; };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function env(t, times, decay) { let v = 0; for (const ti of times) if (t >= ti - 1e-6) v = Math.max(v, Math.exp(-(t - ti) * decay)); return v; }
function vo(x0, x1, y = 0) {
  const g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, C.v1); g.addColorStop(0.45, C.v2); g.addColorStop(0.72, C.o2); g.addColorStop(1, C.o1);
  return g;
}
function setFont(size, weight = 800, ls = -0.02) { ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = (size * ls) + 'px'; }
function textW(s, size, weight = 800) { ctx.save(); setFont(size, weight); const w = ctx.measureText(s).width; ctx.restore(); return w; }
const SPR = {};
function sprite(col) {
  if (SPR[col]) return SPR[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.2, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (SPR[col] = c);
}
function glow(x, y, r, col, a = 1) { // additive glow particle
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(sprite(col), x - r, y - r, r * 2, r * 2); ctx.restore();
}

// ------------------------------------------------------------------ headlines
// One headline on screen at a time. lines: [[text, color], ...]. Slams in (1.4 -> 1.0, easeOutBack) with a
// 5-frame motion-blur smear, holds, then cuts out fast at `out`.
const HEADS = [
  { t0: 0.4, out: 1.95, y: 330, lines: [['EVERY COIN', C.text], ['BLEEDS OUT.', C.text]] },
  { t0: 2.5, out: 3.95, y: 330, lines: [['NOT ON', C.text], ['LIQUID PONZI.', C.text]] },
  { t0: 4.2, out: 6.95, y: 300, lines: [['80%', C.o1, 1.9], ['→ YOUR COIN’S', C.text], ['LIQUIDITY', C.text]] },
  { t0: 7.2, out: 8.95, y: 300, lines: [['AUTOMATED.', C.text], ['COMPOUNDING.', C.text], ['LOCKED.', C.text]] },
  { t0: 9.4, out: 11.95, y: 300, lines: [['20%', C.o1, 1.9], ['→ BUYS & BURNS', C.text], ['$LP', C.text]] },
  { t0: 12.1, out: 13.95, y: 330, lines: [['MORE LAUNCHES.', C.text], ['MORE BURNS.', C.text]] },
];
function headline(t) {
  const h = HEADS.find(h => t >= h.t0 && t < h.out);
  if (!h) return;

function sEnd(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  const e = easeOutBack(clamp(k / 0.3));
  const pulse = 1 + 0.03 * Math.sin(Math.min(t, 14.85) * 9);
  logo(W / 2, 820, 600 * lerp(1.35, 1, e) * pulse, t, { glow: 1.6 + 0.6 * Math.sin(Math.min(t, 14.85) * 9) });
  rings(t, 14.05, W / 2, 820, { r0: 200, r1: 800, lw: 20, life: 0.8, n: 2, flat: 1 });
  const ta = P(t, 14.15, 14.3);
  if (ta > 0) {
    const size = Math.min(112, MAXW / textW('LIQUID PONZI', 100) * 100);
    ctx.save(); ctx.globalAlpha = ta;
    const s2 = lerp(1.2, 1, easeOutBack(P(t, 14.15, 14.4)));
    ctx.translate(W / 2, 1320); ctx.scale(s2, s2);
    setFont(size, 800); ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(138,85,255,.85)'; ctx.shadowBlur = 40; ctx.fillStyle = C.text; ctx.fillText('LIQUID PONZI', 0, 0);
    ctx.restore();
  }
  label('liquidponzi.fun', W / 2, 1440, 44, C.v2, P(t, 14.3, 14.45));
  label('$LP', W / 2, 1520, 44, C.v2, P(t, 14.38, 14.52));
}

// ------------------------------------------------------------------ frame
const SLAMS = HEADS.map(h => h.t0).concat([14.05]);
const IMPACTS = [2.4, 8.0, 9.6, ...BEATS, 14.05];
function render(t) {

  const shake = 8 * env(t, SLAMS, 15) + 26 * env(t, [2.4], 10) + 18 * env(t, [8.0, 9.6], 10) + 10 * env(t, BEATS, 12);
  const ss = Math.min(t, 14.85); // hold the last frame perfectly still
  ctx.save();
  ctx.translate(W / 2 + Math.sin(ss * 0.5) * 10 + (hash(t * 133) - .5) * 2 * shake, H / 2 + Math.cos(ss * 0.4) * 8 + (hash(t * 171) - .5) * 2 * shake);
  ctx.scale(t > 14.85 ? 1 : drift * punch, t > 14.85 ? 1 : drift * punch);
  ctx.translate(-W / 2, -H / 2);
  if (t < 2) sProblem(t);
  else if (t < 4) sTurn(t);
  else if (t < 7) sEighty(t);
  else if (t < 9) sLock(t);
  else if (t < 12) sBurn(t);
  else if (t < 14) sFlywheel(t);
  else sEnd(t);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  headline(t);
  // white flash (15%) on every slam, a stronger one on the big impacts
  const fl = Math.max(0.15 * env(t, SLAMS, 14), 0.22 * env(t, [2.4, 9.6], 10));
  if (fl > 0.01) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }
  // vignette + film grain
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
  const fr = Math.floor(Math.min(t, 14.85) * 30), ox = Math.floor(hash(fr) * 256), oy = Math.floor(hash(fr + 0.5) * 256);
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}

// ------------------------------------------------------------------ sound (Web Audio, no files)
// buildAudio schedules the whole 15 s score on any AudioContext / OfflineAudioContext, starting at t0.
function buildAudio(ac, out, t0) {
  const sr = ac.sampleRate;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const noise = (d) => { const b = ac.createBuffer(1, Math.ceil(d * sr), sr), c = b.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = rnd() * 2 - 1; return b; };
  const master = ac.createGain(); master.gain.value = 0.72;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  master.connect(comp); comp.connect(out);
  const at = s => t0 + s;
  // deep sub-bass drone
  const drone = ac.createGain(); drone.gain.setValueAtTime(0, at(0)); drone.gain.linearRampToValueAtTime(0.26, at(0.6)); drone.gain.setValueAtTime(0.26, at(14.6)); drone.gain.linearRampToValueAtTime(0, at(15));
  const dl = ac.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 180;
  drone.connect(dl); dl.connect(master);
  [[41.2, 'sine', 1], [82.4, 'triangle', 0.35], [61.7, 'sine', 0.25]].forEach(([f, type, g]) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = f;
    const gg = ac.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(drone);
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.3; const lg = ac.createGain(); lg.gain.value = f * 0.01; lfo.connect(lg); lg.connect(o.frequency);
    o.start(at(0)); o.stop(at(15)); lfo.start(at(0)); lfo.stop(at(15));
  });
  // punchy kick
  const kick = (s, v = 1) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160, at(s)); o.frequency.exponentialRampToValueAtTime(42, at(s + 0.12));
    g.gain.setValueAtTime(0.0001, at(s)); g.gain.exponentialRampToValueAtTime(1.0 * v, at(s + 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, at(s + 0.42));
    o.connect(g); g.connect(master); o.start(at(s)); o.stop(at(s + 0.45));
    const n = ac.createBufferSource(); n.buffer = noise(0.03); const ng = ac.createGain(); ng.gain.setValueAtTime(0.35 * v, at(s)); ng.gain.exponentialRampToValueAtTime(0.0001, at(s + 0.03));
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500; n.connect(hp); hp.connect(ng); ng.connect(master); n.start(at(s));
  };
  // water-drop bloop
  const bloop = (s, v = 1, f0 = 260, f1 = 1300) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, at(s)); o.frequency.exponentialRampToValueAtTime(f1, at(s + 0.11));
    g.gain.setValueAtTime(0.0001, at(s)); g.gain.exponentialRampToValueAtTime(0.5 * v, at(s + 0.008)); g.gain.exponentialRampToValueAtTime(0.0001, at(s + 0.24));
    o.connect(g); g.connect(master); o.start(at(s)); o.stop(at(s + 0.26));
  };
  // rising whoosh
  const whoosh = (s, d, v = 0.5) => {
    const n = ac.createBufferSource(); n.buffer = noise(d);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(250, at(s)); bp.frequency.exponentialRampToValueAtTime(7000, at(s + d));
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at(s)); g.gain.exponentialRampToValueAtTime(v, at(s + d * 0.92)); g.gain.exponentialRampToValueAtTime(0.0001, at(s + d));
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at(s));
  };
  // big boom
  const boom = (s, v = 1) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(90, at(s)); o.frequency.exponentialRampToValueAtTime(28, at(s + 0.9));
    g.gain.setValueAtTime(0.0001, at(s)); g.gain.exponentialRampToValueAtTime(1.2 * v, at(s + 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, at(s + 2.2));
    const ws = ac.createWaveShaper(); const cu = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; cu[i] = Math.tanh(x * 3); } ws.curve = cu;
    o.connect(ws); ws.connect(g); g.connect(master); o.start(at(s)); o.stop(at(s + 2.3));
    const n = ac.createBufferSource(); n.buffer = noise(1.2);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2500, at(s)); lp.frequency.exponentialRampToValueAtTime(200, at(s + 1.1));
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.8 * v, at(s)); ng.gain.exponentialRampToValueAtTime(0.0001, at(s + 1.2));
    n.connect(lp); lp.connect(ng); ng.connect(master); n.start(at(s));
  };

  const crackle = (s, d, v) => {
    const n = ac.createBufferSource(), b = ac.createBuffer(1, Math.ceil(d * sr), sr), c = b.getChannelData(0);
    for (let i = 0; i < c.length; i++) c[i] = rnd() < 0.0025 ? (rnd() * 2 - 1) : c[i - 1] * 0.6 || 0;

    const g = ac.createGain(); g.gain.value = v; n.connect(hp); hp.connect(g); g.connect(master); n.start(at(s));
  };
  // ---- the score
  HEADS.forEach(h => kick(h.t0));          // a kick on every text slam
  kick(14.05, 1.1);
  bloop(2.4, 1.1); boom(2.4, 0.45);        // coin hits the water
  [4.0, 4.16, 4.32, 4.48, 4.64].forEach((s, i) => bloop(s + 0.35, 0.45, 300 + i * 40, 1200 + i * 120)); // coins tumble in
  kick(8.0, 1.15);                         // lock snaps shut
  whoosh(7.6, 1.4, 0.55);                  // rising whoosh before 9s
  whoosh(9.1, 0.5, 0.4);                   // the beam
  boom(9.6, 1.0);                          // fire burst
  crackle(9.6, 4.4, 0.35);
  BEATS.forEach(b => { kick(b, 1.1); bloop(b, 0.8); });
  whoosh(13.4, 0.6, 0.35);
}
async function renderAudioWav() { // for exporting a matching soundtrack (offline, sample-exact)
  const oac = new OfflineAudioContext(2, 48000 * DUR, 48000);
  buildAudio(oac, oac.destination, 0);
  const buf = await oac.startRendering();
  const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
  const view = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); view.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 2, true);
  view.setUint32(24, 48000, true); view.setUint32(28, 48000 * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < 2; c++, o += 2) view.setInt16(o, Math.max(-1, Math.min(1, ch[c][i])) * 32767, true);

  return btoa(bin);
}

// ------------------------------------------------------------------ playback, controls, recording
const ui = document.getElementById('ui'), clockEl = document.getElementById('clock'), statusEl = document.getElementById('status');
const bPlay = document.getElementById('play'), bReplay = document.getElementById('replay'), bDl = document.getElementById('download');
let ac = null, startAt = 0, playing = false, recorder = null, lastT = 0;
const fmt = s => `00:${String(Math.floor(s)).padStart(2, '0')}`;
function showUI(on) { ui.classList.toggle('hide', !on); }
async function begin(record) {
  if (playing) return;
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  const out = ac.createGain(); out.connect(ac.destination);
  let dest = null;
  if (record) { dest = ac.createMediaStreamDestination(); out.connect(dest); }
  startAt = ac.currentTime + 0.15;
  buildAudio(ac, out, startAt);
  if (record) {
    const stream = cv.captureStream(60);
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    const chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16000000, audioBitsPerSecond: 192000 });
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'liquid-ponzi-hype.webm';
      document.body.appendChild(a); a.click(); a.remove();
      statusEl.textContent = 'Saved liquid-ponzi-hype.webm';
      bDl.disabled = false;
    };
    render(0);
    recorder.start();
    statusEl.textContent = 'Recording…';
    bDl.disabled = true;
  } else statusEl.textContent = '';

  requestAnimationFrame(loop);
}
function loop() {
  if (!playing) return;
  const t = Math.max(0, ac.currentTime - startAt);
  render(Math.min(t, DUR - 1e-4)); lastT = t;
  if (t >= DUR) {
    playing = false;
    render(DUR - 1e-4);                        // hold the last frame
    if (recorder && recorder.state === 'recording') setTimeout(() => recorder.stop(), 250);
    recorder = null;
    clockEl.textContent = fmt(DUR);
    showUI(true);
    return;
  }
  requestAnimationFrame(loop);
}
bPlay.addEventListener('click', () => begin(false));
bReplay.addEventListener('click', () => begin(false));
bDl.addEventListener('click', () => begin(true));

window.render = render;
window.renderAudioWav = renderAudioWav;
window.DUR = DUR;
window.ready = (async () => {
  try { await Promise.all([document.fonts.load(`800 100px ${FONT}`), document.fonts.load(`700 40px ${FONT}`)]); } catch (e) {}
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const g = GRAIN.getContext('2d'), id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(hash(i * 0.37) * 255); id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  return true;
})();
window.ready.then(() => { render(0.45); clockEl.textContent = fmt(0); });  // poster frame behind the controls
</script>
