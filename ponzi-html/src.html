<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Ponzi ($LP) — hype video</title>
<style>
  /* Unbounded is embedded so the file works offline; system sans-serif is the fallback. */
  @font-face { font-family: 'Unbounded'; src: url(data:font/woff2;base64,__UNBOUNDED__) format('woff2'); font-weight: 200 900; }
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
  body { display: grid; place-items: center; font-family: 'Unbounded', system-ui, sans-serif; }
  #stage { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px; padding-bottom: 7%;
        background: linear-gradient(transparent 55%, rgba(7,6,11,.65)); transition: opacity .2s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: 700 clamp(11px, 1.6vh, 16px)/1 'Unbounded', system-ui, sans-serif; letter-spacing: .04em; color: #f4ecff; cursor: pointer;
           padding: 1.1em 1.6em; border-radius: 999px; border: 1px solid rgba(183,140,255,.55); background: rgba(138,85,255,.18); backdrop-filter: blur(6px); }
  button.primary { background: linear-gradient(90deg, #8a55ff, #ff783f); border-color: transparent; }
  button:hover { filter: brightness(1.15); }
  button[disabled] { opacity: .5; cursor: default; }
  #status { color: #b78cff; font: 600 clamp(10px, 1.3vh, 13px)/1.4 system-ui, sans-serif; min-height: 1.4em; text-align: center; }
  #clock { position: absolute; top: 2%; right: 3%; color: rgba(244,236,255,.75); font: 600 clamp(10px, 1.4vh, 14px)/1 ui-monospace, monospace;
           background: rgba(7,6,11,.6); padding: .4em .6em; border-radius: 6px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <div id="clock">00:00</div>
    <div class="row">
      <button id="play" class="primary" type="button">▶ Play</button>
      <button id="replay" type="button">↻ Replay</button>
      <button id="download" type="button">⬇ Download video</button>
    </div>
    <div id="status"></div>
  </div>
</div>
<script>
/*
  Liquid Ponzi ($LP) — 15 s vertical hype video, 1080x1920, drawn on a canvas from a master clock (render(t), t = 0..15).
  Sound is generated with the Web Audio API (no files). "Download video" records canvas + audio with MediaRecorder to a .webm.
*/
const W = 1080, H = 1920, DUR = 15;
const C = { bg: '#07060b', v1: '#8a55ff', v2: '#b78cff', o1: '#ff783f', o2: '#ff9a5c', text: '#f4ecff', red: '#ff4a3d' };
const FONT = "'Unbounded', system-ui, sans-serif";
const SAFE_X = 80, MAXW = W - SAFE_X * 2;          // text safe area: 80px sides, 200px top/bottom
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const easeOutExpo = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const easeOutBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOut3 = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn2 = x => { x = clamp(x); return x * x; };
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function env(t, times, decay) { let v = 0; for (const ti of times) if (t >= ti - 1e-6) v = Math.max(v, Math.exp(-(t - ti) * decay)); return v; }
function vo(x0, x1, y = 0) {
  const g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0, C.v1); g.addColorStop(0.45, C.v2); g.addColorStop(0.72, C.o2); g.addColorStop(1, C.o1);
  return g;
}
function setFont(size, weight = 800, ls = -0.02) { ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = (size * ls) + 'px'; }
function textW(s, size, weight = 800) { ctx.save(); setFont(size, weight); const w = ctx.measureText(s).width; ctx.restore(); return w; }
const SPR = {};
function sprite(col) {
  if (SPR[col]) return SPR[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.2, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return (SPR[col] = c);
}
function glow(x, y, r, col, a = 1) { // additive glow particle
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(sprite(col), x - r, y - r, r * 2, r * 2); ctx.restore();
}

// ------------------------------------------------------------------ headlines
// One headline on screen at a time. lines: [[text, color], ...]. Slams in (1.4 -> 1.0, easeOutBack) with a
// 5-frame motion-blur smear, holds, then cuts out fast at `out`.
const HEADS = [
  { t0: 0.4, out: 1.95, y: 330, lines: [['EVERY COIN', C.text], ['BLEEDS OUT.', C.text]] },
  { t0: 2.5, out: 3.95, y: 330, lines: [['NOT ON', C.text], ['LIQUID PONZI.', C.text]] },
  { t0: 4.2, out: 6.95, y: 300, lines: [['80%', C.o1, 1.9], ['→ YOUR COIN’S', C.text], ['LIQUIDITY', C.text]] },
  { t0: 7.2, out: 8.95, y: 300, lines: [['AUTOMATED.', C.text], ['COMPOUNDING.', C.text], ['LOCKED.', C.text]] },
  { t0: 9.4, out: 11.95, y: 300, lines: [['20%', C.o1, 1.9], ['→ BUYS & BURNS', C.text], ['$LP', C.text]] },
  { t0: 12.1, out: 13.95, y: 330, lines: [['MORE LAUNCHES.', C.text], ['MORE BURNS.', C.text]] },
];
function headline(t) {
  const h = HEADS.find(h => t >= h.t0 && t < h.out);
  if (!h) return;
  const k = t - h.t0;
  const outK = P(t, h.out - 0.08, h.out);            // fast cut-out
  // one size for the block so every line fits inside the safe width
  const base = Math.min(118, ...h.lines.map(([s, , m = 1]) => MAXW / (textW(s, 100) * m) * 100));
  let y = h.y;
  const drawBlock = (scale, alpha) => {
    ctx.save();
    ctx.translate(W / 2, h.y + 120); ctx.scale(scale, scale); ctx.translate(-W / 2, -(h.y + 120));
    let yy = h.y;
    for (const [s, col, m = 1] of h.lines) {
      const size = base * m;
      setFont(size, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      yy += size * 0.92;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = col === C.o1 ? 'rgba(255,120,63,.7)' : 'rgba(138,85,255,.75)'; ctx.shadowBlur = 36;
      ctx.fillStyle = col; ctx.fillText(s, W / 2, yy);
      yy += size * 0.2;
    }
    ctx.restore();
  };
  // motion blur: 5 trailing copies at the scales of the previous frames
  const sc = tt => lerp(1.4, 1.0, easeOutBack(tt / 0.28));
  if (k < 0.12) for (let f = 5; f >= 1; f--) drawBlock(sc(Math.max(0, k - f / 60)), 0.12 * (6 - f) / 5);
  drawBlock(sc(k) * (1 + 0.012 * k) * lerp(1, 1.08, outK), 1 - outK);
}

// ------------------------------------------------------------------ the logo
function logo(cx, cy, size, t, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return null;
  const h = size * 0.88;
  const top = [cx, cy - h * 0.55], L = [cx - size / 2, cy + h * 0.45], R = [cx + size / 2, cy + h * 0.45];
  const tri = () => { ctx.beginPath(); ctx.moveTo(...top); ctx.lineTo(...R); ctx.lineTo(...L); ctx.closePath(); };
  const g = vo(L[0], R[0], cy);
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalAlpha = a * 0.16; ctx.strokeStyle = g; ctx.lineWidth = size * 0.11; tri(); ctx.stroke();
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(183,140,255,.95)'; ctx.shadowBlur = size * 0.12 * (o.glow ?? 1);
  ctx.strokeStyle = g; ctx.lineWidth = size * 0.036; tri(); ctx.stroke();
  ctx.stroke();
  ctx.save(); tri(); ctx.clip();
  for (let k = 0; k < 2; k++) {
    const yy = cy + h * (0.12 + k * 0.17);
    ctx.beginPath();
    for (let x = L[0]; x <= R[0]; x += 6) {
      const y = yy + Math.sin((x - cx) / size * 9 + t * 3.2 + k * 1.4) * size * 0.028;
      x === L[0] ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = g; ctx.lineWidth = size * 0.024; ctx.shadowColor = 'rgba(255,154,92,.9)'; ctx.shadowBlur = size * 0.06;
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
  return { top, L, R };
}

// ------------------------------------------------------------------ world pieces
let GRAIN;
function backdrop(t, k = 1) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (k <= 0) return;
  // drifting violet + orange glows
  const ax = W * (0.3 + 0.12 * Math.sin(t * 0.5)), ay = H * (0.25 + 0.06 * Math.cos(t * 0.4));
  const g1 = ctx.createRadialGradient(ax, ay, 0, ax, ay, W * 1.0);
  g1.addColorStop(0, `rgba(138,85,255,${0.2 * k})`); g1.addColorStop(1, 'rgba(7,6,11,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const bx = W * (0.75 + 0.1 * Math.cos(t * 0.45)), by = H * (0.8 + 0.05 * Math.sin(t * 0.6));
  const g2 = ctx.createRadialGradient(bx, by, 0, bx, by, W * 0.95);
  g2.addColorStop(0, `rgba(255,120,63,${0.14 * k})`); g2.addColorStop(1, 'rgba(7,6,11,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}
function coin(x, y, r, t, o = {}) {
  const a = o.alpha ?? 1;
  if (o.vy) for (let i = 5; i >= 1; i--) { ctx.globalAlpha = a * 0.07 * (6 - i); ctx.fillStyle = C.v2; ctx.beginPath(); ctx.arc(x, y - o.vy * i / 60, r * (1 - i * 0.05), 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  glow(x, y, r * 3.4, C.v1, 0.6 * a);
  const sq = Math.max(0.18, Math.abs(Math.cos(t * (o.spin ?? 5) + (o.ph || 0))));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(sq, 1);
  const g = ctx.createLinearGradient(-r, -r, r, r); g.addColorStop(0, C.v2); g.addColorStop(0.55, C.o2); g.addColorStop(1, C.o1);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = r * 0.1; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.9, Math.PI * 1.05, Math.PI * 1.6); ctx.stroke(); // rim highlight
  ctx.strokeStyle = 'rgba(7,6,11,.5)'; ctx.lineWidth = r * 0.08; ctx.beginPath(); ctx.arc(0, 0, r * 0.74, 0, Math.PI * 2); ctx.stroke();
  setFont(r * 0.95, 800, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(7,6,11,.8)'; ctx.fillText('$', 0, r * 0.06);
  ctx.restore();
}
function pool(t, surf, o = {}) {
  const amp = o.amp ?? 16, shine = o.shine ?? 1;
  const wave = x => surf + Math.sin(x * 0.012 + t * 3.0) * amp + Math.sin(x * 0.031 - t * 4.4) * amp * 0.45;
  ctx.save();
  const g = ctx.createLinearGradient(0, surf - 30, 0, H);
  g.addColorStop(0, 'rgba(183,140,255,.95)'); g.addColorStop(0.2, 'rgba(138,85,255,.88)'); g.addColorStop(0.75, 'rgba(110,50,200,.9)'); g.addColorStop(1, 'rgba(255,120,63,.7)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, wave(x));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // horizontal violet -> orange tint
  ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = vo(0, W); ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); for (let x = 0; x <= W; x += 12) x ? ctx.lineTo(x, wave(x)) : ctx.moveTo(x, wave(x));
  ctx.strokeStyle = vo(0, W); ctx.lineWidth = 6 + 3 * shine; ctx.shadowColor = 'rgba(255,154,92,.95)'; ctx.shadowBlur = 26 + 20 * shine; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 16; i++) { // caustics, brighter as it shimmers
    const x = (hash(i) * W + t * 70 * (hash(i + 1) - 0.5) + W) % W, y = surf + 40 + hash(i + 3) * (H - surf);
    ctx.globalAlpha = (0.07 + 0.06 * Math.sin(t * 3 + i)) * shine;
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 120 + 160 * hash(i + 5), 3);
  }
  for (let i = 0; i < 24; i++) { // bubbles
    const sp = 120 + 180 * hash(i + 7), ph = (t * sp / 600 + hash(i)) % 1;
    const y = H - ph * (H - surf), x = hash(i + 9) * W + Math.sin(t * 2 + i) * 18;
    if (y < surf + 10) continue;
    ctx.globalAlpha = 0.45 * (1 - ph); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 4 + 8 * hash(i + 2), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function lockIcon(cx, cy, s, closed) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const up = (1 - closed) * 70;
  ctx.lineCap = 'round';
  ctx.strokeStyle = vo(-90, 90); ctx.lineWidth = 26; ctx.shadowColor = 'rgba(183,140,255,.95)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.moveTo(-62, -40 - up); ctx.lineTo(-62, -100 - up); ctx.arc(0, -100 - up, 62, Math.PI, 0); ctx.lineTo(62, -40 - up + (1 - closed) * 50); ctx.stroke();
  ctx.shadowBlur = 50;
  const g = ctx.createLinearGradient(-110, -50, 110, 120); g.addColorStop(0, C.v1); g.addColorStop(1, C.o1);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-110, -50, 220, 180, 32); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(7,6,11,.85)'; ctx.beginPath(); ctx.arc(0, 25, 22, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-9, 30, 18, 52);
  ctx.restore();
}
function rings(t, t0, cx, cy, o = {}) {
  const k = t - t0, life = o.life || 1.0; if (k < 0 || k > life) return;
  for (let j = 0; j < (o.n || 3); j++) {
    const pj = easeOut3(clamp((k - j * 0.09) / life));
    if (pj <= 0) continue;
    const r = (o.r0 || 40) + pj * (o.r1 || 900);
    ctx.save(); ctx.globalAlpha = (1 - pj) * 0.95;
    ctx.strokeStyle = j % 2 ? C.o2 : C.v2; ctx.lineWidth = (o.lw || 22) * (1 - pj) + 2;
    ctx.shadowColor = j % 2 ? 'rgba(255,120,63,.9)' : 'rgba(138,85,255,.95)'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.ellipse(cx, cy, r, r * (o.flat ?? 0.3), 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
function splash(t, t0, cx, cy, n = 60) {
  const k = t - t0; if (k < 0 || k > 1.1) return;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * (0.08 + 0.84 * hash(i + t0)), sp = 500 + 1400 * hash(i + 3 + t0);
    const x = cx + Math.cos(a) * sp * k, y = cy + Math.sin(a) * sp * k + 2200 * k * k;
    glow(x, y, 14 + 12 * hash(i + 5), i % 3 ? C.v2 : C.o2, 1 - k / 1.1);
  }
}
function fire(t, x, y, k, t0) {
  if (k <= 0) return;
  const n = Math.floor(80 * k);
  for (let i = 0; i < n; i++) {
    const life = 0.5 + 0.6 * hash(i), ph = ((t - t0) / life + hash(i + 3)) % 1;
    const sp = (160 + 320 * hash(i + 5)) * (0.7 + 0.5 * k);
    const px = x + (hash(i + 1) - 0.5) * 170 * k * (0.4 + ph) + Math.sin(t * 7 + i) * 22 * ph;
    const py = y - ph * sp * 1.6;
    const r = (24 + 42 * hash(i + 2)) * (1 - ph) * (0.6 + 0.6 * k) * (0.85 + 0.3 * Math.sin(t * 30 + i));
    glow(px, py, r, ph < 0.25 ? '#ffd27a' : ph < 0.5 ? C.o2 : C.o1, (1 - ph) * 0.9);
  }
  glow(x, y, 170 * k, C.o1, 0.65);
}
function embersToCamera(t, x, y, t0, k = 1) { // sparks that fly outward and grow, as if toward the lens
  const dt = t - t0; if (dt < 0) return;
  for (let i = 0; i < 40 * k; i++) {
    const life = 0.9 + 0.6 * hash(i + 40), ph = (dt / life + hash(i + 41)) % 1;
    const a = hash(i + 42) * Math.PI * 2, d = ph * ph * (500 + 700 * hash(i + 43));
    glow(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8 - ph * 120, (6 + 30 * ph * ph) * (0.7 + 0.6 * hash(i + 44)), hash(i) > 0.5 ? '#ffd27a' : C.o2, (1 - ph) * 0.9);
  }
}
function label(s, x, y, size, col, a = 1, align = 'center') {
  ctx.save(); ctx.globalAlpha = a; setFont(size, 700, 0.12); ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();
}
function bigNumber(s, x, y, size, a = 1, align = 'center', col = C.text, glowCol = 'rgba(255,120,63,.8)') {
  ctx.save(); ctx.globalAlpha = a; setFont(size, 800, 0); ctx.textAlign = align; ctx.fillStyle = col; ctx.shadowColor = glowCol; ctx.shadowBlur = 24; ctx.fillText(s, x, y); ctx.restore();
}

// pool surface (px from top) across the film: 12% -> 30% (4-7s), 30% -> 40% (7-9s), jumps on 12.0 / 12.6 / 13.2
function poolSurf(t) {
  let lev = 0.12;
  if (t >= 4) lev = lerp(0.12, 0.30, easeOut3(P(t, 4.0, 7.0)));
  if (t >= 7) lev = lerp(0.30, 0.40, easeOut3(P(t, 7.0, 9.0)));
  if (t >= 12) [12.0, 12.6, 13.2].forEach(b => { if (t >= b) lev += 0.045 * easeOutBack(P(t, b, b + 0.25)); });
  return H * (1 - lev);
}
const BEATS = [12.0, 12.6, 13.2];

// ------------------------------------------------------------------ scenes
function chart() {
  const pts = [], N = 48;
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    let v = Math.pow(u / 0.72, 1.4);                             // pumping up
    v += (hash(i * 3.7) - 0.5) * 0.16 + (i % 2 ? 0.05 : -0.05);  // jagged
    pts.push([SAFE_X + u * 880, 1420 - v * 520]);
  }
  return pts;
}
const PTS = chart();
function sProblem(t) {
  backdrop(t, 0.35);
  // ominous red grid
  ctx.strokeStyle = 'rgba(255,74,61,.07)'; ctx.lineWidth = 2;
  for (let y = 760; y <= 1500; y += 92) { ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(1020, y); ctx.stroke(); }
  const crashT = 1.2;
  const n = Math.max(2, Math.min(PTS.length, Math.floor(P(t, 0.0, crashT) * (PTS.length - 1)) + 2));
  const crash = easeIn2(P(t, crashT, 1.38));                    // straight down
  const shatter = P(t, 1.38, 1.5);                               // the line breaks into droplets
  const last = PTS[n - 1];
  const crashY = lerp(last[1], 1640, crash);
  if (shatter < 1) {
    ctx.save(); ctx.globalAlpha = 1 - shatter;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const g = ctx.createLinearGradient(SAFE_X, 0, SAFE_X + 880, 0); g.addColorStop(0, '#c2552f'); g.addColorStop(1, C.red);
    const path = () => { ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(...PTS[i]) : ctx.moveTo(...PTS[i]); if (t > crashT) ctx.lineTo(last[0] + 30 * crash, crashY); };
    ctx.strokeStyle = g; ctx.globalAlpha *= 0.2; ctx.lineWidth = 30; path(); ctx.stroke();
    ctx.globalAlpha = 1 - shatter; ctx.lineWidth = 9; ctx.shadowColor = 'rgba(255,74,61,.9)'; ctx.shadowBlur = 24; path(); ctx.stroke();
    ctx.restore();
    if (t < crashT) glow(last[0], last[1], 60, C.red, 1); else glow(last[0] + 30 * crash, crashY, 80, C.red, 1);
  }
  // droplets: every point of the line falls and fades
  if (t >= 1.38) {
    for (let i = 0; i < PTS.length; i++) {
      const t0 = 1.38 + hash(i * 5.1) * 0.25, k = t - t0; if (k < 0) continue;
      const [x, y0] = PTS[i];
      const y = y0 + 1500 * k * k, a = 1 - k / 0.62;
      if (a <= 0) continue;
      for (let s = 3; s >= 0; s--) glow(x, y - s * 3000 * k / 60, 15 - s * 3, i % 3 ? C.red : C.o1, a * (1 - s * 0.22));
    }
  }
  // desaturate the whole scene for an ominous feel
  ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(128,128,128,.55)'; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function sTurn(t) {
  backdrop(t, P(t, 2.5, 3.2));
  const water = H * 0.75, hit = 2.4;
  if (t < hit) {
    const p = easeIn2(P(t, 2.05, hit));

function streams(t, t0, coins) {

  coins.forEach(([cx, cy, ph], i) => {
    for (let j = 0; j < 10; j++) {
      const p = ((t - t0) * 1.3 + j / 10 + hash(i * 9 + j)) % 1;
      const x = lerp(cx, W / 2 + (hash(i * 3 + j) - 0.5) * 760, p) + Math.sin(p * 6 + i) * 36;
      const y = lerp(cy + 40, surf, easeIn2(p));

}
function sEighty(t) {
  backdrop(t);

    const tin = 4.0 + i * 0.16, e = easeOutBack(P(t, tin, tin + 0.5));
    const x = 170 + i * 185, y = lerp(-120, 900 + (i % 2) * 70, e) + Math.sin(t * 2 + i) * 12;
    return [x, y, i, tin];

  coins.forEach(([x, y, i, tin]) => coin(x, y, 48, t, { ph: i, rot: (1 - P(t, tin, tin + 0.5)) * 4 }));
  pool(t, poolSurf(t));
}
function sLock(t) {
  backdrop(t);
  const surf = poolSurf(t);
  pool(t, surf, { amp: 20, shine: 1 + P(t, 7, 9) * 1.5 });
  const closed = easeOutExpo(P(t, 8.0, 8.1));
  const s = 1 + 0.16 * env(t, [8.0], 9);
  lockIcon(W / 2, surf - 250, 1.3 * s, closed);
  if (t >= 8.0) rings(t, 8.0, W / 2, surf - 250, { r0: 120, r1: 620, lw: 16, life: 0.7, n: 2, flat: 1 });

  const v = Math.floor(lerp(184000, 412000, easeOut3(P(t, 7.0, 9.0))) + 937 * Math.floor(t * 60) % 1000);
  label('LIQUIDITY ↑', W / 2, surf + 170, 34, C.v2, P(t, 7.1, 7.3));
  bigNumber(v.toLocaleString('en-US'), W / 2, surf + 260, 80, P(t, 7.1, 7.3), 'center', C.text, 'rgba(138,85,255,.9)');
}
const SUPPLY0 = 1000000000;
function supplyAt(t) {
  if (t < 9.6) return SUPPLY0;
  let burnt = Math.floor((Math.min(t, 12) - 9.6) * 2370000);
  if (t >= 12) burnt += Math.floor((Math.min(t, 14) - 12) * 6100000);
  return SUPPLY0 - burnt - (t >= 9.6 ? (Math.floor(t * 60) * 7919) % 99999 : 0);
}
function supplyCounter(t, a) {
  label('$LP SUPPLY', W - SAFE_X, 1300, 30, C.o2, a, 'right');
  bigNumber(supplyAt(t).toLocaleString('en-US'), W - SAFE_X, 1380, 64, a, 'right');
}
function sBurn(t) {
  backdrop(t, 1.15);

  pool(t, surf, { amp: 20, shine: 1.6 });

function sFlywheel(t) {

function sEnd(t) {

  logo(W / 2, 820, 600 * lerp(1.35, 1, e) * pulse, t, { glow: 1.6 + 0.6 * Math.sin(Math.min(t, 14.85) * 9) });

// ------------------------------------------------------------------ frame
const SLAMS = HEADS.map(h => h.t0).concat([14.05]);
const IMPACTS = [2.4, 8.0, 9.6, ...BEATS, 14.05];
function render(t) {
  t = clamp(t, 0, DUR - 1e-4);

  const shake = 8 * env(t, SLAMS, 15) + 26 * env(t, [2.4], 10) + 18 * env(t, [8.0, 9.6], 10) + 10 * env(t, BEATS, 12);
  const ss = Math.min(t, 14.85); // hold the last frame perfectly still
  ctx.save();

  ctx.scale(t > 14.85 ? 1 : drift * punch, t > 14.85 ? 1 : drift * punch);
  ctx.translate(-W / 2, -H / 2);

  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // white flash (15%) on every slam, a stronger one on the big impacts
  const fl = Math.max(0.15 * env(t, SLAMS, 14), 0.22 * env(t, [2.4, 9.6], 10));
  if (fl > 0.01) { ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); }

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');

// ------------------------------------------------------------------ sound (Web Audio, no files)

function buildAudio(ac, out, t0) {

    const lfo = ac.createOscillator(); lfo.frequency.value = 0.3; const lg = ac.createGain(); lg.gain.value = f * 0.01; lfo.connect(lg); lg.connect(o.frequency);

async function renderAudioWav() { // for exporting a matching soundtrack (offline, sample-exact)

// ------------------------------------------------------------------ playback, controls, recording
const ui = document.getElementById('ui'), clockEl = document.getElementById('clock'), statusEl = document.getElementById('status');
const bPlay = document.getElementById('play'), bReplay = document.getElementById('replay'), bDl = document.getElementById('download');
let ac = null, startAt = 0, playing = false, recorder = null, lastT = 0;
const fmt = s => `00:${String(Math.floor(s)).padStart(2, '0')}`;
function showUI(on) { ui.classList.toggle('hide', !on); }
async function begin(record) {
  if (playing) return;
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  const out = ac.createGain(); out.connect(ac.destination);
  let dest = null;
  if (record) { dest = ac.createMediaStreamDestination(); out.connect(dest); }
  startAt = ac.currentTime + 0.15;
  buildAudio(ac, out, startAt);
  if (record) {
    const stream = cv.captureStream(60);
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);

      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'liquid-ponzi-hype.webm';
      document.body.appendChild(a); a.click(); a.remove();
      statusEl.textContent = 'Saved liquid-ponzi-hype.webm';
      bDl.disabled = false;
    };
    render(0);
    recorder.start();
    statusEl.textContent = 'Recording…';
    bDl.disabled = true;

}
function loop() {

  if (t >= DUR) {

    render(DUR - 1e-4);                        // hold the last frame
    if (recorder && recorder.state === 'recording') setTimeout(() => recorder.stop(), 250);
    recorder = null;
    clockEl.textContent = fmt(DUR);
    showUI(true);
    return;
  }
  requestAnimationFrame(loop);
}
bPlay.addEventListener('click', () => begin(false));
bReplay.addEventListener('click', () => begin(false));
bDl.addEventListener('click', () => begin(true));

window.render = render;
window.renderAudioWav = renderAudioWav;
window.DUR = DUR;
window.ready = (async () => {
  try { await Promise.all([document.fonts.load(`800 100px ${FONT}`), document.fonts.load(`700 40px ${FONT}`)]); } catch (e) {}
  GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
  const g = GRAIN.getContext('2d'), id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(hash(i * 0.37) * 255); id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  return true;
})();
window.ready.then(() => { render(0.45); clockEl.textContent = fmt(0); });  // poster frame behind the controls
